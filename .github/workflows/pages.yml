# Deploy the static site to GitHub Pages.
# The site has no build step; the repository root is the site.
name: Deploy static content to Pages

# Manual only. Creating a Pages site needs pages=write and administration=write,
# which this repository's GitHub Actions token does not have. After an admin
# sets Settings → Pages → Source to GitHub Actions, run this workflow.
on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Pages
        uses: actions/configure-pages@v5
        with:
          # Create the Pages site (GitHub Actions source) when it does not exist yet.
          enablement: true
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "."
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
